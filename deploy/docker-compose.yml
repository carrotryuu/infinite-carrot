services:
  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    ports: ['${WEB_PORT:-80}:80']
    depends_on:
      server: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 3
  server:
    build: { context: .., dockerfile: deploy/Dockerfile, target: server }
    environment:
      NODE_ENV: production
      TZ: UTC
      MOCK_EXTERNAL: '${MOCK_EXTERNAL:-1}'
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-carrot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-carrot}'
      REDIS_URL: redis://redis:6379
      NAS_ROOT: /nas
      PORT: '3000'
      HEALTH_TIMEOUT_MS: '${HEALTH_TIMEOUT_MS:-2000}'
    volumes: ['${NAS_ROOT:?Set an absolute NAS_ROOT in .env}:/nas']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    environment:
      NODE_ENV: production
      TZ: UTC
      MOCK_EXTERNAL: '${MOCK_EXTERNAL:-1}'
      REDIS_URL: redis://redis:6379
      NAS_ROOT: /nas
    volumes: ['${NAS_ROOT:?Set an absolute NAS_ROOT in .env}:/nas']
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    init: true
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-carrot}'
      POSTGRES_USER: '${POSTGRES_USER:-carrot}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}'
      TZ: UTC
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-bookworm
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
