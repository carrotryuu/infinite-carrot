name: Project checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carrot
          POSTGRES_USER: carrot
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U carrot" --health-interval=5s --health-timeout=3s --health-retries=10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      DATABASE_URL: postgresql://carrot:test-only@127.0.0.1:5432/carrot
      REDIS_URL: redis://127.0.0.1:6379/0
      MOCK_EXTERNAL: '1'
      E2E_REQUIRE_HEALTHY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - name: Prepare test NAS directory
        run: |
          mkdir -p "$RUNNER_TEMP/carrot-nas"
          echo "NAS_ROOT=$RUNNER_TEMP/carrot-nas" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build && pnpm db:validate
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: test-results/
          retention-days: 7
